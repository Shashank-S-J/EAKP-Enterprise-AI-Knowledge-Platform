# Render.com Blueprint — deploy all backend services
# Free tier: 512MB RAM, sleeps after 15min inactivity
# Docs: https://render.com/docs/blueprint-spec
# NOTE: Database is hosted on Neon.tech — set DB_* env vars manually on Render Dashboard

services:
  # ── API Gateway ────────────────────────────────────────────────────────────
  - type: web
    name: eakp-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ── Chat Service ───────────────────────────────────────────────────────────
  - type: web
    name: eakp-chat-service
    runtime: docker
    plan: free
    dockerfilePath: ./chat-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASS
        sync: false
      - key: JWT_SECRET
        fromService:
          name: eakp-api-gateway
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  # ── Ingestion Service ──────────────────────────────────────────────────────
  - type: web
    name: eakp-ingestion-service
    runtime: docker
    plan: free
    dockerfilePath: ./ingestion-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASS
        sync: false
      - key: JWT_SECRET
        fromService:
          name: eakp-api-gateway
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASS
        sync: false
      - key: RABBITMQ_VHOST
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  # ── Admin Service ──────────────────────────────────────────────────────────
  - type: web
    name: eakp-admin-service
    runtime: docker
    plan: free
    dockerfilePath: ./admin-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASS
        sync: false
      - key: JWT_SECRET
        fromService:
          name: eakp-api-gateway
          type: web
          envVarKey: JWT_SECRET
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASS
        sync: false
      - key: RABBITMQ_VHOST
        sync: false