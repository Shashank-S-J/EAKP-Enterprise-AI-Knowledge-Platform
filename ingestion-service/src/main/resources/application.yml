server:
  port: ${PORT:8082}
  shutdown: graceful
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eakp}
    username: ${DB_USER:eakp}
    password: ${DB_PASS:eakp_local_pass}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eakp}
    password: ${RABBITMQ_PASS:eakp_local_pass}
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1             # one message at a time per consumer
        retry:
          enabled: true
          initial-interval: 5s
          max-attempts: 3
          multiplier: 2.0

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

# MinIO / S3
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LW1pbmltdW0tMjU2LWJpdHM=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-headers: Authorization,Content-Type,X-Correlation-Id

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:eakp-documents}
    region: ${MINIO_REGION:us-east-1}

  ingestion:
    chunk-size: 512
    chunk-overlap: 64
    batch-size: 50             # embed N chunks per batch call
    supported-types: pdf,docx,doc,txt,md,html,pptx,xlsx,csv

  rabbitmq:
    exchange: eakp.ingestion
    queue:
      ingest: eakp.ingest.queue
      ingest-dlq: eakp.ingest.dlq
      notify: eakp.notify.queue
    routing-key:
      ingest: ingest.document
      notify: notify.ready

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.eakp: DEBUG
    dev.langchain4j: INFO
    org.springframework.ai: INFO
    io.minio: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local

  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eakp}}
    username: ${DB_USER:eakp}
    password: ${DB_PASS:}

  data:
    redis:
      ssl:
        enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    virtual-host: ${RABBITMQ_VHOST:${RABBITMQ_USER}}
    ssl:
      enabled: true

  ai:
    openai:
      base-url: https://api-inference.huggingface.co
      api-key: ${HF_API_KEY}
      embedding:
        options:
          model: sentence-transformers/all-MiniLM-L6-v2
    vectorstore:
      pgvector:
        dimensions: 384  # all-MiniLM-L6-v2 = 384 dims

# In prod, JWT_SECRET MUST be provided via env var — no fallback
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-headers: Authorization,Content-Type,X-Correlation-Id

logging:
  level:
    com.eakp: INFO